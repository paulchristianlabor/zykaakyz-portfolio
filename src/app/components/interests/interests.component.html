<section id="interests" class="py-24 bg-slate-50" aria-label="Interests and passions">
  <div class="max-w-6xl mx-auto px-6">
    <!-- Section heading -->
    <div class="text-center mb-16" appScrollReveal>
      <p class="text-indigo-600 text-sm font-semibold uppercase tracking-widest mb-3">Interests</p>
      <h2 class="text-4xl font-bold text-slate-900 tracking-tight">What I'm passionate about</h2>
      <p class="text-slate-500 mt-4 max-w-xl mx-auto leading-relaxed">
        A few things that keep me curious, creative, and engaged with the world.
      </p>
    </div>

    <!-- Interests grid -->
    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
      @for (interest of interests; track interest.id) {
        <article
          class="bg-white rounded-2xl p-6 shadow-sm hover:shadow-md transition-shadow border border-slate-100 flex flex-col"
          appScrollReveal
        >
          <!-- Emoji icon -->
          <div class="text-4xl mb-4" aria-hidden="true">{{ interest.emoji }}</div>

          <!-- Title -->
          <h3 class="text-xl font-semibold text-slate-900 mb-2">{{ interest.title }}</h3>

          <!-- Description -->
          <p class="text-slate-500 text-sm leading-relaxed flex-1 mb-4">
            {{ interest.description }}
          </p>

          <!-- Tags -->
          <div class="flex flex-wrap gap-2" role="list" [attr.aria-label]="interest.title + ' tags'">
            @for (tag of interest.tags; track tag) {
              <span
                class="px-3 py-1 bg-indigo-50 text-indigo-600 rounded-full text-xs font-medium ring-1 ring-inset ring-indigo-100"
                role="listitem"
              >
                {{ tag }}
              </span>
            }
          </div>
        </article>
      }
    </div>
  </div>
</section>
