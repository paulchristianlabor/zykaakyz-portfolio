<section id="gallery" class="py-24 bg-slate-50" aria-label="Visual gallery">
  <div class="max-w-6xl mx-auto px-6">
    <!-- Section heading -->
    <div class="text-center mb-16" appScrollReveal>
      <p class="text-indigo-600 text-sm font-semibold uppercase tracking-widest mb-3">Gallery</p>
      <h2 class="text-4xl font-bold text-slate-900 tracking-tight">Visual highlights</h2>
      <p class="text-slate-500 mt-4 max-w-xl mx-auto leading-relaxed">
        A curated collection of visual work — photography, design, and experiments.
      </p>
    </div>

    <!-- Gallery grid -->
    <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
      @for (item of gallery; track item.id) {
        <article
          class="group relative aspect-square rounded-2xl overflow-hidden shadow-sm hover:shadow-lg transition-all duration-300 cursor-default"
          appScrollReveal
        >
          <!-- Gradient placeholder image -->
          <div
            class="absolute inset-0"
            [style.background]="item.gradient"
            role="img"
            [attr.aria-label]="item.title + ' — ' + item.description"
          ></div>

          <!-- Hover overlay with info -->
          <div
            class="absolute inset-0 flex flex-col justify-end p-4 transition-all duration-300"
            style="background: rgba(15, 23, 42, 0)"
            [style.background]="'rgba(15,23,42,' + 0 + ')'"
          >
            <div
              class="opacity-0 group-hover:opacity-100 transition-opacity duration-300 translate-y-2 group-hover:translate-y-0 transition-transform"
            >
              <span
                class="inline-block px-2 py-0.5 rounded text-xs font-medium text-white/90 mb-1.5"
                style="background: rgba(255, 255, 255, 0.15)"
              >
                {{ item.category }}
              </span>
              <p class="text-white font-semibold text-sm leading-snug">{{ item.title }}</p>
            </div>
          </div>

          <!-- SR-only description -->
          <span class="sr-only">{{ item.category }}: {{ item.description }}</span>
        </article>
      }
    </div>
  </div>
</section>
