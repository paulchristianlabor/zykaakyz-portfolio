<section
  id="home"
  class="min-h-screen relative overflow-hidden"
  style="background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 50%, #f5f3ff 100%)"
  aria-label="Introduction"
>
  <!-- Decorative background blobs -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none" aria-hidden="true">
    <div
      class="absolute -top-48 -right-48 w-[600px] h-[600px] rounded-full opacity-30"
      style="background: radial-gradient(circle, #a5b4fc 0%, transparent 70%)"
    ></div>
    <div
      class="absolute -bottom-48 -left-48 w-[500px] h-[500px] rounded-full opacity-20"
      style="background: radial-gradient(circle, #c4b5fd 0%, transparent 70%)"
    ></div>
  </div>

  <!-- Main hero content -->
  <div class="relative z-10 min-h-screen flex flex-col items-center justify-center px-6 py-32 text-center">
    <!-- Welcome badge -->
    <div
      class="inline-flex items-center gap-2.5 px-4 py-2 rounded-full border border-indigo-100 bg-white/80 text-indigo-600 text-sm font-medium mb-10 backdrop-blur-sm shadow-sm"
    >
      <span class="w-2 h-2 rounded-full bg-indigo-500 animate-pulse" aria-hidden="true"></span>
      Welcome to my corner of the web
    </div>

    <!-- Name heading -->
    <h1 class="text-5xl sm:text-6xl lg:text-7xl font-bold text-slate-900 tracking-tight leading-tight mb-5">
      Hi, I'm
      <span
        class="inline-block"
        style="
          background: linear-gradient(135deg, #4f46e5, #7c3aed);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
        "
      >
        {{ name }}
      </span>
    </h1>

    <!-- Role / subtitle -->
    <p class="text-xl sm:text-2xl text-slate-500 font-medium mb-6">
      {{ role }}
    </p>

    <!-- Tagline -->
    <p class="text-base sm:text-lg text-slate-600 max-w-2xl leading-relaxed mb-12">
      {{ tagline }}
    </p>

    <!-- CTA buttons -->
    <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
      <a
        href="#projects"
        class="w-full sm:w-auto px-8 py-3.5 rounded-xl bg-indigo-600 text-white font-semibold text-sm hover:bg-indigo-700 transition-colors shadow-md hover:shadow-lg text-center"
      >
        View My Work
      </a>
      <a
        href="#contact"
        class="w-full sm:w-auto px-8 py-3.5 rounded-xl border-2 border-slate-200 bg-white text-slate-700 font-semibold text-sm hover:border-indigo-300 hover:text-indigo-600 transition-colors text-center"
      >
        Get in Touch
      </a>
    </div>
  </div>

  <!-- Scroll indicator -->
  <div
    class="absolute bottom-8 left-1/2 -translate-x-1/2 flex flex-col items-center gap-2 text-slate-400"
    aria-hidden="true"
  >
    <span class="text-xs font-medium uppercase tracking-widest">Scroll</span>
    <svg
      class="w-5 h-5 animate-bounce"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
      aria-hidden="true"
      focusable="false"
    >
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
    </svg>
  </div>
</section>
